plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'uy.wingfoil.tracker'
    compileSdk 34

    defaultConfig {
        applicationId 'uy.wingfoil.tracker'
        minSdk 29          // Android 10 o superior
        targetSdk 34
        versionCode 47
        versionName '1.49'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Clave fija: permite instalar versiones nuevas encima sin perder las sesiones grabadas
    signingConfigs {
        fixed {
            storeFile file('wingfoil.keystore')
            storePassword 'wingfoil'
            keyAlias 'wingfoil'
            keyPassword 'wingfoil'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Python dentro de la app: corre wingfoil_analisis.py tal cual (app/src/main/python)
chaquopy {
    defaultConfig {
        version '3.11'
        buildPython 'python3'
        pip {
            install 'openpyxl'
        }
    }
}
