name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk WingfoilTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WingfoilTracker-apk
          path: WingfoilTracker.apk

      - name: Publicar en Releases (descarga directa desde el teléfono)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest WingfoilTracker.apk \
            -t "Wingfoil Tracker — última versión" \
            -n "APK compilado automáticamente desde ${GITHUB_SHA::7}"
